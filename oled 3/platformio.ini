; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
monitor_speed = 115200

[platformio]
boards_dir = ./boards

[env:T-Display-AMOLED]
platform = espressif32@6.13.0
board = lilygo-t-amoled
framework = arduino
build_unflags =
  -std=gnu++11

build_flags =
  -std=gnu++2a
  -D DISABLE_ALL_LIBRARY_WARNINGS
	-DBOARD_HAS_PSRAM
  -I $PROJECT_DIR/src
  ; Export display geometry for shared display_core library compilation
  -DTFT_ROT=3
  -DLCD_WIDTH=536
  -DLCD_HEIGHT=240
  ; Enable -DARDUINO_USB_CDC_ON_BOOT will start printing and wait for terminal access during startup
  -DARDUINO_USB_CDC_ON_BOOT=1

  ; Enable -UARDUINO_USB_CDC_ON_BOOT will turn off printing and will not block when using the battery
  ; -UARDUINO_USB_CDC_ON_BOOT

  ; -DCORE_DEBUG_LEVEL=4
  -DLOG_LOCAL_LEVEL=4
	
lib_deps =
    bblanchon/ArduinoJson@^6.21.3
    https://github.com/DCRalph/dcr_input.git#7ef39203c8c8fd395228a1adc32235a851b9ca1f
    ; TFT_eSPI (lib/) includes SPIFFS from a processor header the dependency finder misses.
    SPIFFS
    https://github.com/DCRalph/dcr_display.git#d6d14435ade7961647146b4a050c4d5ef6b9b389
    https://github.com/DCRalph/wireless_mesh.git#909cf91a1ae3d89ab9341cc865fa8fdb42fb1188
    symlink://../libs/remote_protocol
    https://github.com/DCRalph/dcr_logger.git
    https://github.com/dcralph/dcr_fatalHandler.git
    https://github.com/DCRalph/dcr_taskManager.git
    https://github.com/DCRalph/dcr_timeProfiler.git