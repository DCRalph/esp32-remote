; Touch UI test bench for the bioreactor-controller board (ESP32-S3, ILI9341 320x240,
; XPT2046 touch). Flashing replaces the bioreactor app; its NVS and filesystem are
; left alone (same partition table, read-only access). See README.md.

[platformio]
boards_dir = ./boards
build_cache_dir = ~/.buildcache

[env:controller]
platform = espressif32@6.13.0
board = bactosure32
board_build.mcu = esp32s3
framework = arduino
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
monitor_speed = 115200
upload_speed = 921600
monitor_filters =
	time
	esp32_exception_decoder
build_type = debug

build_unflags =
	-std=gnu++11
build_flags =
	-std=gnu++2a
	-D BOARD_HAS_PSRAM
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D CORE_DEBUG_LEVEL=3
	-I $PROJECT_DIR/src
	; TFT_eSPI setup, as the bioreactor's lib/TFT_eSPI/User_Setup.h.
	-D USER_SETUP_LOADED=1
	; TFT_eSPI only puts sprites in PSRAM with this; the S3 sdkconfig names it differently.
	-D CONFIG_SPIRAM_SUPPORT=1
	-D ILI9341_DRIVER=1
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=320
	-D TFT_CS=10
	-D TFT_MOSI=11
	-D TFT_SCLK=12
	-D TFT_MISO=13
	-D TFT_DC=7
	-D TFT_RST=6
	-D TOUCH_CS=16
	-D USE_HSPI_PORT=1
	-D SPI_FREQUENCY=70000000
	-D SPI_READ_FREQUENCY=20000000
	-D SPI_TOUCH_FREQUENCY=2500000
	-D LOAD_GLCD=1
	-D LOAD_GFXFF=1
	-D SMOOTH_FONT=1
	-D DISABLE_ALL_LIBRARY_WARNINGS

lib_deps =
	bodmer/TFT_eSPI@2.5.43
	https://github.com/DCRalph/dcr_display.git#6b0bdc0c1a94fac48c2c206680795fdf8ffdc4fd
	https://github.com/DCRalph/dcr_logger.git
	https://github.com/dcralph/dcr_fatalHandler.git
	https://github.com/DCRalph/dcr_taskManager.git
	https://github.com/DCRalph/dcr_timeProfiler.git
