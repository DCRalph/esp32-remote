; Dual-screen handheld: LilyGO T-Display S3 (320x170 ST7789, two buttons) plus an
; ILI9341 320x240 SPI panel with XPT2046 touch. See README.md for wiring.

[platformio]
build_cache_dir = ~/.buildcache

[env:esp32]
platform = espressif32@6.13.0
board = lilygo-t-display-s3
framework = arduino
monitor_speed = 115200
monitor_filters =
	time
	esp32_exception_decoder
build_type = debug

lib_deps =
	bblanchon/ArduinoJson@^7.0.0
	https://github.com/DCRalph/dcr_display.git#c94a1fb6a519010977cf9ef097790c7a310e1f03
	https://github.com/DCRalph/dcr_logger.git
	https://github.com/dcralph/dcr_fatalHandler.git
	https://github.com/DCRalph/dcr_taskManager.git
	https://github.com/DCRalph/dcr_files.git
	https://github.com/DCRalph/dcr_httpClient.git
	https://github.com/DCRalph/dcr_netLink.git
	adafruit/Adafruit GFX Library@^1.11.9
	adafruit/Adafruit BusIO@^1.16.1
	adafruit/Adafruit ILI9341@^1.6.1
	; The registry release lacks begin(SPIClass&), needed to share the panel's bus.
	https://github.com/PaulStoffregen/XPT2046_Touchscreen.git

build_unflags =
	-std=gnu++11
build_flags =
	-std=gnu++2a
	-D DISABLE_ALL_LIBRARY_WARNINGS
	-D BOARD_HAS_PSRAM
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_USB_MODE=1
	-I $PROJECT_DIR/src
