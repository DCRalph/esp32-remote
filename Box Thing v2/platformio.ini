; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
boards_dir = ./boards

[env:esp32s3]
; dcr_display is consumed from a local checkout because this board needs two
; additions that are not upstream yet: MenuStyle::setMetrics (menu geometry for a
; 128x64 panel) and Display::setTopBarRenderer (mono top bar). Once those land,
; drop this line and move dcr_display into lib_deps with the others.
lib_extra_dirs = ../libs

platform = espressif32@6.11.0
board = box-thing
framework = arduino

board_build.flash_mode = qio
board_build.mcu = esp32s3
board_upload.flash_size = 4MB
board_build.filesystem = littlefs

; upload_speed = 115200
monitor_speed = 115200

build_flags =
		-std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=1
		-DARDUINO_USB_MODE=1

  	-DCORE_DEBUG_LEVEL=3
		; -DLOG_LOCAL_LEVEL=3
build_unflags = -std=gnu++11

build_type = debug
monitor_filters = esp32_exception_decoder

board_build.partitions = partitions.csv

lib_deps =
  	olikraus/U8g2
		bblanchon/ArduinoJson@^7.0.0
		https://github.com/madhephaestus/ESP32Encoder.git
		https://github.com/adafruit/Adafruit_DRV2605_Library.git

		https://github.com/DCRalph/wireless_mesh.git
		https://github.com/dcralph/dcr_fatalHandler.git
		https://github.com/DCRalph/dcr_httpClient.git
		https://github.com/DCRalph/dcr_netLink.git
		https://github.com/DCRalph/dcr_logger.git
		https://github.com/DCRalph/dcr_files.git
		https://github.com/DCRalph/dcr_taskManager.git
