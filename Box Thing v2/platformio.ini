; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
boards_dir = ./boards
build_cache_dir = ~/.buildcache

[env:esp32s3]
platform = espressif32@6.13.0
board = box-thing
framework = arduino

board_build.flash_mode = qio
board_build.mcu = esp32s3
board_upload.flash_size = 4MB
board_build.filesystem = littlefs

; upload_speed = 115200
monitor_speed = 115200

build_flags =
		-std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=1
		-DARDUINO_USB_MODE=1

  	-DCORE_DEBUG_LEVEL=3
		; -DLOG_LOCAL_LEVEL=3
build_unflags = -std=gnu++11

build_type = debug
monitor_filters = esp32_exception_decoder

board_build.partitions = partitions.csv

lib_deps =
  	olikraus/U8g2
		bblanchon/ArduinoJson@^7.0.0
		https://github.com/madhephaestus/ESP32Encoder.git
		https://github.com/adafruit/Adafruit_DRV2605_Library.git

		https://github.com/DCRalph/wireless_mesh.git#909cf91a1ae3d89ab9341cc865fa8fdb42fb1188
		symlink://../libs/remote_protocol
		https://github.com/dcralph/dcr_fatalHandler.git
		https://github.com/DCRalph/dcr_httpClient.git
		https://github.com/DCRalph/dcr_netLink.git
		https://github.com/DCRalph/dcr_logger.git
		https://github.com/DCRalph/dcr_files.git
		https://github.com/DCRalph/dcr_taskManager.git
		https://github.com/DCRalph/dcr_timeProfiler.git
		https://github.com/DCRalph/dcr_display.git#fe89e97a777e2ed983b1ca4638941807030bc664
